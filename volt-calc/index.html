<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ulises LC - Volt Calc</title>
  <meta name="theme-color" content="#101820">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="circuit-bg" aria-hidden="true">
    <div class="trace-layer trace-layer-a"></div>
    <div class="trace-layer trace-layer-b"></div>
    <div class="pulse pulse-one"></div>
    <div class="pulse pulse-two"></div>
    <div class="pulse pulse-three"></div>
  </div>

  <main class="interface">
    <h1>Ulises LC - Volt Calc</h1>

    <section class="actions" aria-label="Calculadoras disponibles">
      <button class="calc-button" type="button" data-target="calcs/kw-amp/kw-amp.html">
        <span>KW -&gt; Amp</span>
      </button>
      <button class="calc-button" type="button" data-target="calcs/caida-volt/caida-volt.html">
        <span>CAIDA DE VOLTAJE</span>
      </button>
    </section>
  </main>

  <script src="script.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("service-worker.js"));
    }
  </script>
</body>
</html>
