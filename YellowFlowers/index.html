<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08070d" />
    <title>Un ramo que permanece</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/ico" href="assets/yellow-rose-neon.png" />
  </head>
  <body>
    <main class="site-shell">
      <section class="message-card" aria-label="Mensaje especial">
        <span class="card-sparkle">✦</span>
        <p>Yo sé que no es lo mismo que un ramo real, pero estas durarán para siempre. La intención es lo que cuenta.</p>
        <span class="card-sparkle">✦</span>
      </section>

      <section class="garden" aria-label="Ramo de rosas amarillas">
        <div class="stars" aria-hidden="true"></div>
        <div class="bouquet-glow" aria-hidden="true"></div>
        <div id="bouquet" class="bouquet" aria-live="polite"></div>
        
      </section>
      <p id="status" class="status">Preparando algo que no se marchita…</p>
    </main>
    <script src="code.js"></script>
  </body>
</html>
